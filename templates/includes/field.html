{% comment %}Render one bound form field. Usage: {% include 'includes/field.html' with field=form.email %}{% endcomment %}
<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="check-row">
      {{ field }}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %} <span class="text-pink" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
