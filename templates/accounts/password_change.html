{% extends 'base.html' %}

{% block content %}
<section class="section" style="min-height:70svh;display:grid;place-items:center">
  <div class="wrap wrap-tight" style="max-width:480px">
    <h1 style="font-size:2rem">Change your password</h1>
    <p class="text-soft mb-4">Enter your current password, then choose a new one.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form.html' %}
      <button type="submit" class="btn btn-block btn-lg">Update password</button>
    </form>
    <p class="center mt-3"><a href="{% url 'accounts:profile' %}" class="btn-quiet">Cancel</a></p>
  </div>
</section>
{% endblock %}
