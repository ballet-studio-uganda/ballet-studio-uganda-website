{% extends 'base.html' %}

{% block content %}
<section class="section" style="min-height:70svh;display:grid;place-items:center">
  <div class="wrap wrap-tight" style="max-width:480px">
    <h1 style="font-size:2rem">Choose a new password</h1>
    <p class="text-soft mb-4">Pick something you have not used elsewhere.</p>
    {% if validlink %}<form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form.html' %}
      <button type="submit" class="btn btn-block btn-lg">Save new password</button>
    </form>{% else %}<div class="alert alert-error"><i class="fas fa-circle-exclamation"></i><div>This reset link has expired or has already been used. <a href="{% url 'accounts:password_reset' %}" class="text-pink">Request a new one</a>.</div></div>{% endif %}
  </div>
</section>
{% endblock %}
