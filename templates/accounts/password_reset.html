{% extends 'base.html' %}

{% block content %}
<section class="section" style="min-height:70svh;display:grid;place-items:center">
  <div class="wrap wrap-tight" style="max-width:480px">
    <h1 style="font-size:2rem">Reset your password</h1>
    <p class="text-soft mb-4">Enter the email address on your account and we will send you a reset link.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form.html' %}
      <button type="submit" class="btn btn-block btn-lg">Send reset link</button>
    </form>
    <p class="center mt-3"><a href="{% url 'accounts:login' %}" class="btn-quiet">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
