{% extends 'base.html' %}

{% block content %}
<section class="section" style="min-height:70svh;display:grid;place-items:center">
  <div class="wrap wrap-tight center">
    <div class="avatar avatar-xl" style="margin-inline:auto;background:var(--success)">
      <i class="fas fa-check" style="font-size:2.5rem"></i>
    </div>
    <h1 class="mt-4">Thank you</h1>
    <p class="lede mt-2" style="margin-inline:auto">
      We have your enquiry. Someone from the studio will call or WhatsApp you within
      two working days to arrange a trial class.
    </p>
    <div class="row mt-4" style="justify-content:center">
      <a href="{% url 'website:home' %}" class="btn">Back to the studio</a>
      <a href="{% url 'website:programmes' %}" class="btn btn-outline">Browse programmes</a>
    </div>
  </div>
</section>
{% endblock %}
